<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="window-title">Boxxed</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="light" data-accent="blue">

    <!-- MODAL DE SETUP INICIAL -->
    <div id="setup-modal" class="modal-overlay hidden">
        <div class="card">
            <h2 id="txt-setup-title">Configuración Inicial</h2>
            <form onsubmit="handleSetup(event)">
                <input type="text" id="setup-user" placeholder="Usuario Administrador" required>
                <input type="password" id="setup-pass" placeholder="Contraseña" minlength="6" required>
                <button type="submit" id="txt-setup-btn">
                    Crear Superusuario
                </button>
            </form>
        </div>
    </div>

    <!-- APLICACIÓN PRINCIPAL -->
    <div id="app-container" class="hidden" style="display: flex; flex-direction: column; height: 100vh; width: 100%;">
        <header>
            <h1 id="app-title">Boxxed - Inventario</h1>

            <div class="header-actions">
                <button onclick="toggleViewMode()" id="btn-view-mode" class="icon-button view-toggle" aria-label="Cambiar vista" title="Cambiar vista">
                    <span aria-hidden="true">▦</span>
                </button>

                <button onclick="togglePanel('item')" id="btn-create-item" class="btn-primary">
                    + Crear ítem
                </button>

                <button onclick="togglePanel('category')" id="btn-nav-categories" class="btn-primary">
                    Categorías
                </button>

                <button onclick="openSettingsView()" id="btn-nav-settings" class="btn-secondary">
                    Ajustes
                </button>

                <button onclick="logout()" class="btn-danger" id="btn-logout">
                    Salir
                </button>
            </div>
        </header>

        <main>
            <div class="inventory-toolbar">
                <div class="search-container">
                    <span class="search-icon" aria-hidden="true">⌕</span>
                    <input type="text" id="search-bar" placeholder="Buscar..." oninput="loadItems()">
                </div>
                <div class="filter-row">
                    <select id="filter-category" onchange="loadItems()">
                        <option value="">Todas las categorías</option>
                    </select>
                    <select id="filter-group" onchange="loadItems()">
                        <option value="">Todos los grupos</option>
                    </select>
                </div>
            </div>

            <div id="items-container">
                <!-- Se renderiza en grid o tabla -->
            </div>
        </main>
    </div>

    <!-- PANTALLA DE AJUSTES INTEGRADA -->
    <div id="settings-view" class="hidden">
        <header>
            <h1 id="settings-header-title">Ajustes</h1>

            <div class="header-actions">
                <button onclick="closeSettingsView()" id="btn-back-inventory">
                    Volver al inventario
                </button>
            </div>
        </header>

        <div class="settings-layout">
            <div class="settings-sidebar">
                <h2 id="txt-settings-heading">Preferencias</h2>

                <button class="settings-nav-item active" onclick="switchSettingsTab('appearance', this)"
                    id="nav-tab-appearance">
                    Aspecto
                </button>

                <button class="settings-nav-item" onclick="switchSettingsTab('language', this)" id="nav-tab-language">
                    Idioma
                </button>

                <button class="settings-nav-item hidden" onclick="switchSettingsTab('administration', this)"
                    id="nav-tab-admin">
                    Administración
                </button>
            </div>

            <div class="settings-content-area">
                <!-- Pestaña: Aspecto -->
                <div id="settings-tab-appearance" class="settings-panel-section">
                    <h3 id="txt-appearance-title">Aspecto</h3>

                    <div class="settings-card">
                        <div class="setting-group">
                            <label id="lbl-theme" for="theme-select">
                                Tema
                            </label>

                            <select id="theme-select" onchange="changeTheme(this.value)">
                                <option value="light" id="opt-light">
                                    Claro
                                </option>
                                <option value="dark" id="opt-dark">
                                    Oscuro
                                </option>
                            </select>
                        </div>

                        <div class="setting-group" style="margin-top: 1rem;">
                            <label id="lbl-accent">Color de acento</label>

                            <div class="color-picker" style="margin-top: 0.5rem;">
                                <button type="button" aria-label="Color azul" style="background: #2563eb;"
                                    onclick="changeAccent('blue')"></button>
                                <button type="button" aria-label="Color verde" style="background: #16a34a;"
                                    onclick="changeAccent('green')"></button>
                                <button type="button" aria-label="Color morado" style="background: #7c3aed;"
                                    onclick="changeAccent('purple')"></button>
                                <button type="button" aria-label="Color naranja" style="background: #ea580c;"
                                    onclick="changeAccent('orange')"></button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Pestaña: Idioma -->
                <div id="settings-tab-language" class="settings-panel-section hidden">
                    <h3 id="txt-language-title">Idioma</h3>

                    <div class="settings-card">
                        <div class="setting-group">
                            <label id="lbl-lang" for="lang-select">
                                Idioma de la aplicación
                            </label>

                            <select id="lang-select" onchange="changeLanguage(this.value)">
                                <option value="es-ES">
                                    Español (España)
                                </option>
                                <option value="en-GB">
                                    English (UK)
                                </option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Pestaña: Administración -->
                <div id="settings-tab-administration" class="settings-panel-section hidden">
                    <h3 id="txt-admin-title">Administración</h3>

                    <!-- Gestión de grupos -->
                    <div class="settings-card">
                        <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px;">
                            <h4 id="group-form-title" style="margin: 0; font-size: 1.1rem;">
                                Nuevo Grupo
                            </h4>

                            <button type="button" onclick="resetGroupForm()" id="btn-cancel-group" class="hidden"
                                style="padding: 4px 8px; font-size: 0.8rem; background: var(--text-muted); color: white; border: none; border-radius: 4px; cursor: pointer;">
                                Cancelar Edición
                            </button>
                        </div>

                        <input type="hidden" id="edit-group-id" value="">

                        <input type="text" id="new-group-name" placeholder="Nombre del grupo">

                        <button type="button" onclick="saveGroup()" id="btn-save-group">
                            Crear Grupo
                        </button>
                    </div>

                    <div class="settings-card" style="margin-top: 1.5rem;">
                        <h4 style="margin: 0; font-size: 1.1rem;">
                            Grupos Existentes
                        </h4>

                        <div id="groups-list"
                            style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;"></div>
                    </div>

                    <!-- Gestión de usuarios -->
                    <div class="settings-card" style="margin-top: 1.5rem;">
                        <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px;">
                            <h4 id="user-form-title" style="margin: 0; font-size: 1.1rem;">
                                Nuevo Usuario
                            </h4>

                            <button type="button" onclick="resetUserForm()" id="btn-cancel-user" class="hidden"
                                style="padding: 4px 8px; font-size: 0.8rem; background: var(--text-muted); color: white; border: none; border-radius: 4px; cursor: pointer;">
                                Cancelar Edición
                            </button>
                        </div>

                        <input type="hidden" id="edit-user-id" value="">

                        <input type="text" id="new-user-name" placeholder="Nombre de usuario" required>

                        <input type="password" id="new-user-pass"
                            placeholder="Contraseña (dejar en blanco para no cambiar)">

                        <label id="lbl-user-group" for="new-user-group">
                            Grupo Asignado:
                        </label>

                        <select id="new-user-group">
                            <option value="">(Ninguno)</option>
                        </select>

                        <button type="button" onclick="saveUser()" id="btn-save-user">
                            Crear Usuario
                        </button>
                    </div>

                    <div class="settings-card" style="margin-top: 1.5rem;">
                        <h4 id="txt-existing-users" style="margin: 0; font-size: 1.1rem;">
                            Usuarios Existentes
                        </h4>

                        <div id="users-list"
                            style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- PANEL LATERAL PARA FORMULARIOS DE ÍTEMS Y CATEGORÍAS -->
    <aside id="side-panel" class="hidden">
        <div class="panel-header">
            <h2 id="panel-title">Panel</h2>

            <button type="button" class="btn btn-secondary btn-small" id="btn-expand-panel"
                onclick="togglePanelSize()" title="Ampliar panel">Ampliar</button>

            <button type="button" class="close-btn" onclick="closePanel()" aria-label="Cerrar panel">
                ✕
            </button>
        </div>

        <!-- Formulario de ítems -->
        <form id="item-form" class="panel-content hidden" onsubmit="saveItem(event)">
            <input type="hidden" id="edit-item-id" value="">

            <div class="section-title-row">
                <h3 id="item-form-title">Nuevo Ítem</h3>

                <button type="button" id="btn-cancel-item" class="btn btn-secondary btn-small hidden"
                    onclick="resetItemForm()">
                    Cancelar edición
                </button>
            </div>
            <input type="text" id="item-name" placeholder="Nombre" required>

            <textarea id="item-desc" placeholder="Descripción"></textarea>

            <input type="number" id="item-qty" placeholder="Cantidad" value="1" min="0">

            <label id="lbl-item-cat" for="item-category">
                Categoría:
            </label>

            <select id="item-category" required>
                <option value="" disabled selected>
                    Selecciona categoría
                </option>
            </select>

            <label id="lbl-item-group" for="item-group">
                Grupo de Visibilidad:
            </label>

            <select id="item-group">
                <option value="">(Sin grupo / Público)</option>
            </select>

            <label id="lbl-item-tags">Etiquetas:</label>
            <div class="tag-picker">
                <div id="selected-tags" class="selected-tags" aria-live="polite"></div>
                <input type="text" id="tag-search" placeholder="Buscar o crear etiqueta" autocomplete="off">
                <div id="item-tags-list" class="tag-suggestions hidden"></div>
            </div>

            <label id="lbl-item-barcode" for="item-barcode">Código o valor escaneable:</label>
            <div class="input-with-action">
                <input type="text" id="item-barcode" placeholder="Código de barras, QR o referencia">
                <button type="button" class="btn btn-secondary" id="btn-scan-item" onclick="scanItemCode()">
                    Escanear
                </button>
            </div>
            <input type="file" id="barcode-camera-input" class="hidden" accept="image/*" capture="environment"
                onchange="decodeBarcodeImage(this.files[0])">

            <label id="lbl-item-photos" for="item-photos">Fotos del artículo:</label>
            <input type="file" id="item-photos" accept="image/*" multiple onchange="previewItemPhotos(this.files)">
            <div id="item-photo-preview" class="photo-preview"></div>

            <section id="item-existing-media" class="edit-item-media hidden">
                <div class="section-title-row">
                    <h3 id="txt-existing-item-photos">Fotos actuales</h3>
                    <!-- <span id="item-existing-photo-count" class="photo-count-label"></span> -->
                </div>
                <div id="item-existing-photos" class="photo-preview"></div>
            </section>

            <button type="submit" id="btn-save-item" class="btn btn-primary btn-block">
                Crear Ítem
            </button>
        </form>

        <!-- Panel de categorías -->
        <div id="category-content" class="panel-content hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px;">
                <h3 id="txt-new-category-title">
                    Nueva Categoría
                </h3>

                <button type="button" onclick="resetCategoryForm()" id="btn-cancel-category" class="hidden"
                    style="padding: 4px 8px; font-size: 0.8rem; background: var(--text-muted); color: white; border: none; border-radius: 4px; cursor: pointer;">
                    Cancelar Edición
                </button>
            </div>

            <input type="hidden" id="edit-category-id" value="">

            <input type="text" id="cat-name" placeholder="Nombre de categoría">

            <label id="lbl-cat-group" for="cat-group">
                Grupo Asociado:
            </label>

            <select id="cat-group">
                <option value="">(Ninguno)</option>
            </select>

            <button type="button" onclick="saveCategory()" id="btn-create-cat">
                Crear Categoría
            </button>

            <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 10px 0;">

            <h4 id="txt-existing-categories" style="margin: 0; font-size: 0.9rem; color: var(--text-muted);">
                Categorías Existentes
            </h4>

            <div id="categories-list" style="display: flex; flex-direction: column; gap: 8px; margin-top: 5px;"></div>
        </div>
    </aside>

    <script src="/vendor/@zxing/browser/umd/zxing-browser.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
