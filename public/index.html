<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="window-title">Boxxed</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="light" data-accent="blue">

    <!-- MODAL DE SETUP INICIAL -->
    <div id="setup-modal" class="modal-overlay hidden">
        <div class="card">
            <h2 id="txt-setup-title">Configuración Inicial</h2>
            <form onsubmit="handleSetup(event)">
                <input type="text" id="setup-user" placeholder="Usuario Administrador" required>
                <input type="password" id="setup-pass" placeholder="Contraseña" required>
                <button type="submit" id="txt-setup-btn">Crear Superusuario</button>
            </form>
        </div>
    </div>

   

    <!-- APLICACIÓN PRINCIPAL -->
    <div id="app-container" class="hidden" style="display: flex; flex-direction: column; height: 100vh; width: 100%;">
        <header>
            <h1 id="app-title">Boxxed - Inventario</h1>
            <div class="header-actions">
                <button onclick="toggleViewMode()" id="btn-view-mode">Vista Tabla</button>
                <button onclick="togglePanel('item')">+ Crear ítem</button>
                <button onclick="togglePanel('category')" id="btn-nav-categories">Categorías</button>
                <button onclick="openSettingsView()" id="btn-nav-settings">Ajustes</button>
                <button onclick="logout()" class="btn-danger" id="btn-logout">Salir</button>
            </div>
        </header>

        <main>
            <div class="search-container">
                <input type="text" id="search-bar" placeholder="Buscar..." oninput="loadItems()">
            </div>
            <div id="items-container">
                <!-- Se renderiza en grid o tabla -->
            </div>
        </main>
    </div>

    <!-- PANTALLA DE AJUSTES ESTILO IMMICH -->
    <div id="settings-view" class="hidden">
        <header>
            <h1 id="settings-header-title">Ajustes</h1>
            <div class="header-actions">
                <button onclick="closeSettingsView()" id="btn-back-inventory">Volver al inventario</button>
            </div>
        </header>
        <div class="settings-layout">
            <div class="settings-sidebar">
                <h2 id="txt-settings-heading">Preferencias</h2>
                <button class="settings-nav-item active" onclick="switchSettingsTab('appearance', this)" id="nav-tab-appearance">Aspecto</button>
                <button class="settings-nav-item" onclick="switchSettingsTab('language', this)" id="nav-tab-language">Idioma</button>
                <button class="settings-nav-item hidden" onclick="switchSettingsTab('administration', this)" id="nav-tab-admin">Administración</button>
            </div>
            <div class="settings-content-area">
                <!-- Pestaña: Aspecto -->
                <div id="settings-tab-appearance" class="settings-panel-section">
                    <h3 id="txt-appearance-title">Aspecto</h3>
                    <div class="settings-card">
                        <div class="setting-group">
                            <label id="lbl-theme">Tema</label>
                            <select id="theme-select" onchange="changeTheme(this.value)">
                                <option value="light" id="opt-light">Claro</option>
                                <option value="dark" id="opt-dark">Oscuro</option>
                            </select>
                        </div>
                        <div class="setting-group" style="margin-top: 1rem;">
                            <label id="lbl-accent">Color de acento</label>
                            <div class="color-picker" style="margin-top: 0.5rem;">
                                <button style="background: #2563eb;" onclick="changeAccent('blue')"></button>
                                <button style="background: #16a34a;" onclick="changeAccent('green')"></button>
                                <button style="background: #7c3aed;" onclick="changeAccent('purple')"></button>
                                <button style="background: #ea580c;" onclick="changeAccent('orange')"></button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Pestaña: Idioma -->
                <div id="settings-tab-language" class="settings-panel-section hidden">
                    <h3 id="txt-language-title">Idioma</h3>
                    <div class="settings-card">
                        <div class="setting-group">
                            <label id="lbl-lang">Idioma de la aplicación</label>
                            <select id="lang-select" onchange="changeLanguage(this.value)">
                                <option value="es-ES">Español (España)</option>
                                <option value="en-GB">English (UK)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Pestaña: Administración -->
                <div id="settings-tab-administration" class="settings-panel-section hidden">
                    <h3 id="txt-admin-title">Administración</h3>
                    <div class="settings-card">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <h4 id="user-form-title" style="margin: 0; font-size: 1.1rem;">Nuevo Usuario</h4>
                            <button onclick="resetUserForm()" id="btn-cancel-user" class="hidden" style="padding: 4px 8px; font-size: 0.8rem; background: var(--text-muted); color: white; border: none; border-radius: 4px; cursor: pointer;">Cancelar Edición</button>
                        </div>
                        <input type="hidden" id="edit-user-id" value="">
                        <input type="text" id="new-user-name" placeholder="Nombre de usuario" required>
                        <input type="password" id="new-user-pass" placeholder="Contraseña (dejar en blanco para no cambiar)">
                        <label id="lbl-user-group">Grupo Asignado:</label>
                        <select id="new-user-group">
                            <option value="">(Ninguno)</option>
                        </select>
                        <button onclick="saveUser()" id="btn-save-user">Crear Usuario</button>
                    </div>

                    <div class="settings-card" style="margin-top: 1.5rem;">
                        <h4 id="txt-existing-users" style="margin: 0; font-size: 1.1rem;">Usuarios Existentes</h4>
                        <div id="users-list" style="display: flex; flex-direction: column; gap: 10px; margin-top: 5px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- PANEL LATERAL (DRAWER) PARA FORMULARIOS RÁPIDOS (EJ. CATEGORÍAS E ÍTEMS) -->
    <aside id="side-panel" class="hidden">
        <div class="panel-header">
            <h2 id="panel-title">Panel</h2>
            <button class="close-btn" onclick="closePanel()">✕</button>
        </div>
        
        <!-- Formulario de Ítems -->
        <form id="item-form" class="panel-content hidden" onsubmit="saveItem(event)">
            <input type="text" id="item-name" placeholder="Nombre" required>
            <textarea id="item-desc" placeholder="Descripción"></textarea>
            <input type="number" id="item-qty" placeholder="Cantidad" value="1">
            
            <label id="lbl-item-cat">Categoría:</label>
            <select id="item-category" required>
                <option value="" disabled selected>Selecciona categoría</option>
            </select>

            <label id="lbl-item-group">Grupo de Visibilidad:</label>
            <select id="item-group">
                <option value="">(Sin grupo / Público)</option>
            </select>

            <input type="text" id="item-tags" placeholder="Etiquetas (separadas por comas)">
            <button type="submit" id="btn-save-item">Guardar Ítem</button>
        </form>

        <!-- Panel de Categorías -->
        <div id="category-content" class="panel-content hidden">
            <h3 id="txt-new-category-title">Nueva Categoría</h3>
            <input type="text" id="cat-name" placeholder="Nombre de categoría">
            <label id="lbl-cat-group">Grupo Asociado:</label>
            <select id="cat-group">
                <option value="">(Ninguno)</option>
            </select>
            <button onclick="saveCategory()" id="btn-create-cat">Crear Categoría</button>
            <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 10px 0;">
            <h4 id="txt-existing-categories" style="margin: 0; font-size: 0.9rem; color: var(--text-muted);">Categorías Existentes</h4>
            <div id="categories-list" style="display: flex; flex-direction: column; gap: 8px; margin-top: 5px;"></div>
        </div>
    </aside>

    <script src="js/app.js"></script>
</body>
</html>
