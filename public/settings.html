<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxxed - Ajustes</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="light" data-accent="blue">
    <div id="settings-view" style="display:flex;flex-direction:column;height:100vh">
        <header class="app-header">
            <div><span class="eyebrow">BOXXED</span>
                <h1>Ajustes</h1>
                <p id="settings-subtitle" class="header-subtitle">Personaliza la aplicación y administra accesos.</p>
            </div>
            <div class="header-actions"><button class="btn btn-secondary" onclick="window.location.href='/'">← Volver al
                    inventario</button></div>
        </header>
        <div class="settings-layout" style="display:flex;flex:1;overflow:hidden">
            <div class="settings-sidebar"
                style="width:280px;background:var(--panel-bg);border-right:1px solid var(--border-color);padding:1.5rem;display:flex;flex-direction:column;gap:.5rem">
                <h2 id="settings-preferences">Preferencias</h2><button id="tab-appearance" class="settings-nav-item active"
                    onclick="switchTab('appearance',this)">Aspecto</button><button class="settings-nav-item"
                    onclick="switchTab('language',this)">Idioma</button><button id="tab-admin"
                    class="settings-nav-item hidden" onclick="switchTab('administration',this)">Administración</button>
            </div>
            <div class="settings-content-area" style="flex:1;padding:2.5rem;overflow-y:auto">
                <div id="section-appearance" class="settings-panel-section">
                    <h3 id="appearance-title">Aspecto</h3>
                    <div class="settings-card"><label id="theme-label">Tema</label><select id="theme-select"
                            onchange="changeTheme(this.value)">
                            <option value="light">Claro</option>
                            <option value="dark">Oscuro</option>
                        </select><label id="accent-label" style="margin-top:1rem">Color de acento</label>
                        <div class="color-picker"><button style="background:#2563eb"
                                onclick="changeAccent('blue')"></button><button style="background:#16a34a"
                                onclick="changeAccent('green')"></button><button style="background:#7c3aed"
                                onclick="changeAccent('purple')"></button><button style="background:#ea580c"
                                onclick="changeAccent('orange')"></button></div>
                    </div>
                </div>
                <div id="section-language" class="settings-panel-section hidden">
                    <h3 id="language-title">Idioma</h3>
                    <div class="settings-card"><label id="language-label">Idioma de la aplicación</label><select id="lang-select"
                            onchange="changeLanguage(this.value)">
                            <option value="es-ES">Español (España)</option>
                            <option value="en-GB">English (UK)</option>
                        </select></div>
                </div>
                <div id="section-administration" class="settings-panel-section hidden">
                    <div class="page-heading">
                        <div><span class="eyebrow">CONTROL DE ACCESO</span>
                            <h3 id="admin-title">Administración</h3>
                            <p id="admin-subtitle">Organiza grupos y usuarios desde un único lugar.</p>
                        </div>
                        <div id="admin-only" class="stat-pill">Solo superusuario</div>
                    </div>
                    <div class="admin-grid">
                        <div class="settings-card admin-list-card">
                            <div class="card-heading">
                                <div><span class="card-icon">≡</span>
                                    <h4 id="groups-title">Grupos existentes</h4>
                                </div><button id="new-group-button" class="btn btn-primary btn-small" onclick="openGroupModal()">+ Nuevo grupo</button>
                            </div>
                            <div id="groups-list" class="management-list"></div>
                        </div>
                    </div>
                    <div class="admin-grid admin-grid-users">
                        <div class="settings-card admin-list-card">
                            <div class="card-heading">
                                <div><span class="card-icon">◎</span>
                                    <h4 id="users-title">Usuarios existentes</h4>
                                </div><button id="new-user-button" class="btn btn-primary btn-small" onclick="openUserModal()">+ Nuevo usuario</button>
                            </div>
                            <div id="users-list" class="management-list"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="group-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="group-form-title">
        <div class="settings-card user-modal-card">
            <div class="card-heading">
                <h3 id="group-form-title">Nuevo grupo</h3>
                <button type="button" class="close-btn" onclick="closeGroupModal()" aria-label="Cerrar">×</button>
            </div>
            <input id="edit-group-id" type="hidden">
            <label id="group-name-label" for="group-name">Nombre del grupo</label>
            <input id="group-name" type="text" placeholder="Nombre del grupo" required>
            <div class="modal-actions">
                <button type="button" id="cancel-group-button" class="btn btn-secondary" onclick="closeGroupModal()">Cancelar</button>
                <button type="button" id="btn-save-group" class="btn btn-primary" onclick="saveGroup()">Crear grupo</button>
            </div>
        </div>
    </div>
    <div id="user-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="user-form-title">
        <div class="settings-card user-modal-card">
            <div class="card-heading">
                <h3 id="user-form-title">Nuevo usuario</h3>
                <button type="button" class="close-btn" onclick="closeUserModal()" aria-label="Cerrar">×</button>
            </div>
            <input id="edit-user-id" type="hidden">
            <label id="user-name-label" for="user-name">Nombre de usuario</label>
            <input id="user-name" type="text" placeholder="Nombre de usuario" required>
            <label id="user-password-label" for="user-password">Contraseña</label>
            <input id="user-password" type="password" placeholder="Contraseña, en edición puede quedar vacía">
            <label id="user-group-label" for="user-group">Grupo asignado</label>
            <select id="user-group"><option value="">(Sin grupo)</option></select>
            <div class="modal-actions">
                <button type="button" id="cancel-user-button" class="btn btn-secondary" onclick="closeUserModal()">Cancelar</button>
                <button type="button" id="btn-save-user" class="btn btn-primary" onclick="saveUser()">Crear usuario</button>
            </div>
        </div>
    </div>
    <script src="js/settings.js"></script>
</body>

</html>
